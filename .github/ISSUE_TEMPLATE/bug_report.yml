name: "🐛 Bug Report"
description: "Report a reproducible bug"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      placeholder: "Describe the bug"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. ... 2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: false
