name: "✨ Feature Request"
description: "Suggest a new feature"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / motivation"
      placeholder: "What problem does this solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
    validations:
      required: true
