name: SEO guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: README carries a search snippet
        run: |
          grep -q '^# ' README.md || { echo "README needs an H1"; exit 1; }
          test "$(wc -l < README.md)" -ge 3 || { echo "README needs a tagline paragraph"; exit 1; }

      - name: inspo landed -> derived social assets required
        run: |
          if [ -d inspo ]; then
            test -d public/og || { echo "inspo/ landed but public/og/ missing (see docs/seo.md)"; exit 1; }
            test -f public/og/og.png || { echo "public/og/og.png missing (see docs/seo.md)"; exit 1; }
          else
            echo "no inspo yet; social-asset guard dormant"
          fi
