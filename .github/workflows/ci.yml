name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Node project
        id: node
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.node.outputs.exists == 'true'
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install (npm, if present)
        if: steps.node.outputs.exists == 'true'
        run: npm ci

      - name: Lint (if present)
        if: steps.node.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Typecheck (if present)
        if: steps.node.outputs.exists == 'true'
        run: npm run typecheck --if-present

      - name: Build (if present)
        if: steps.node.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Audit (if present)
        if: steps.node.outputs.exists == 'true'
        run: npm audit --audit-level=critical
